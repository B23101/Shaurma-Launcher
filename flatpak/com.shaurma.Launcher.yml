# com.shaurma.Launcher.yml — Flatpak-пакет Shaurma Launcher для Linux.
#
# Збирає scripts/build-linux-flatpak.sh (на GitHub — job linux-flatpak у
# build-launcher.yml, локально — той самий скрипт у WSL/Linux). Скрипт кладе
# цей файл у теку збірки (dist/flatpak-stage) разом із кодом, тож шляхи нижче
# відносні до неї.
#
# Усе компілюється ВСЕРЕДИНІ org.gnome.Sdk//50: shell, backend.so і updater.so
# лінкуються рівно з тими GTK4/WebKitGTK 6.0, що є в org.gnome.Platform//50.
# Тому на будь-якому дистрибутиві з flatpak нічого системного докачувати не
# треба: рантайм і драйвери GL flatpak ставить сам із flathub.
#
# Оновлення: shell і бібліотеки лежать у read-only /app, тож нова версія
# лаунчера = новий пакет. Updater качає ShaurmaLauncher.flatpak з релізу GitHub
# (sha256 — з підписаного маніфесту) і перевстановлює застосунок через flatpak
# на хості (updater-backend/internal/core/flatpak_update.go).

app-id: com.shaurma.Launcher
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

# Ім'я команди = linuxExeNames (shell визначає з нього теку даних).
command: ShaurmLauncher

# Байти backend.so/updater.so мають лишитися такими, як зібрано (seed-маніфест
# звіряє sha256), тож без strip і debuginfo.
build-options:
  no-debuginfo: true
  strip: false

finish-args:
  # Мережа: збірки, моди, друзі, оновлення.
  - --share=network
  # Вікно лаунчера (GTK4 через Wayland, якщо він є) і гра. Minecraft (LWJGL/GLFW)
  # працює через X11/XWayland, тому --socket=x11, а не fallback-x11.
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  # Звук гри (PulseAudio або pipewire-pulse).
  - --socket=pulseaudio
  # Wails реєструє org.wails.<ім'я>; трей (StatusNotifierItem) і сповіщення.
  - --own-name=org.wails.*
  # «Один екземпляр» Wails: org.wails_app_<UniqueID>.SingleInstance, де UniqueID
  # закінчується назвою теки exe (/app/bin → «bin», shell/main.go installDirName).
  # Без цього дозволу лаунчер у пісочниці виходив одразу після старту.
  - --own-name=org.wails_app_com_shaurma_launcher_single_instance_bin.SingleInstance
  - --own-name=org.kde.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Самооновлення: flatpak-spawn --host flatpak install --reinstall <пакет>.
  - --talk-name=org.freedesktop.Flatpak
  # Автозапуск (~/.config/autostart хоста).
  - --filesystem=xdg-config/autostart:create
  # Discord Rich Presence.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord

modules:
  # wl-copy/wl-paste для буфера обміну на Wayland (у рантаймі їх немає).
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  # xrandr: старі версії Minecraft (LWJGL 2, до 1.12.2) викликають його, щоб
  # дізнатися режими екрана; без нього гра падає ще до вікна.
  - name: xrandr
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/app/xrandr-1.5.4.tar.xz
        sha256: 2cafccb2aaf2491a4068676117a0d4f90ab307724b96fffc54cd1da953779400

  - name: shaurma-launcher
    buildsystem: simple
    build-options:
      # go mod download під час збірки (власний репозиторій, не Flathub).
      build-args:
        - --share=network
      env:
        CGO_ENABLED: '1'
        GOTOOLCHAIN: local
        GOFLAGS: -mod=mod -modcacherw
    build-commands:
      - sh ./build-in-sdk.sh
    sources:
      - type: archive
        url: https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
        sha256: ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5
        dest: goroot
      - type: dir
        path: src
