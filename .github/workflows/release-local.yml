name: Release local build (public, no secrets)

# Публічний релізний zip, який люди запускають локально без CDN.
# У збірку НЕ потрапляють справжні токени й API-ключі (CurseForge/Groq/Gemini/Google) —
# лише заглушки, тож цей workflow безпечно запускати в публічному репозиторії.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія (напр. 1.0.0); буде тег v<версія>"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LAUNCHER_ROOT: ${{ github.workspace }}
      VERSION: ${{ github.event.inputs.version }}
      EDITIONS: shaurma
      TOKEN_SHAURMA: local-only-placeholder-shaurma
      TOKEN_BASE: local-only-placeholder-base
      GOTOOLCHAIN: auto
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            **/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # C-компілятор для cgo (backend.dll / updater.dll, -buildmode=c-shared).
      # Збірка шукає саме C:\msys64\clang64\bin\clang.exe (див. windows.go).
      - name: Install clang64 (msys2)
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-clang-x86_64-clang"
          & C:\msys64\clang64\bin\clang.exe --version

      - name: Install wails3 CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.121
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Build launcher
        shell: pwsh
        working-directory: pack-manager
        run: go run ./cmd/ci-build

      # Портативний zip: усі компоненти вже на місці (shell, backend.dll, updater.dll,
      # frontend/, launcher-version.json) — розпакував і запустив, bootstrap з CDN не потрібен.
      - name: Pack portable zips
        shell: pwsh
        run: |
          foreach ($d in Get-ChildItem dist -Directory -Filter 'app-*' | Where-Object { $_.Name -notmatch 'linux' }) {
            $ed  = $d.Name -replace '^app-', ''
            $tmp = Join-Path $env:RUNNER_TEMP "portable-$ed"
            $dst = Join-Path $tmp 'ShaurmLauncher'
            if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
            robocopy $d.FullName $dst /E /XD bootstrap build /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
            # Маркер: updater.dll у цій збірці не ходить на CDN і довіряє лише локальним файлам.
            Set-Content -Path (Join-Path $dst 'local-only.flag') -Value 'local build' -Encoding ascii
            $zip = "dist/ShaurmLauncher-portable-$ed-$env:VERSION.zip"
            Compress-Archive -Path $dst -DestinationPath $zip -Force
            Write-Host "created $zip"
          }

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter 'ShaurmLauncher-portable-*.zip' | ForEach-Object FullName)
          # Збірки Шаурми (.shaurmbundle), експортовані з лаунчера, кладіть у теку bundles/ репозиторію.
          if (Test-Path bundles) { $files += @(Get-ChildItem bundles -Filter '*.shaurmbundle' | ForEach-Object FullName) }
          gh release create "v$env:VERSION" @files --title "Shaurma Launcher $env:VERSION" --generate-notes
