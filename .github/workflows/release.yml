# Build -> sign (SignPath Foundation) -> draft GitHub release.
#
# * Push a tag v*  : full release, Windows signed via SignPath, Linux gets build attestations.
# * Run manually   : "sign" = false builds everything unsigned (dry run, safe to try first).
#
# No secrets live in this repository. They are GitHub Actions secrets / variables:
#   secrets:  SIGNPATH_API_TOKEN
#             SHRM_BUILD_TOKEN_SHAURMA  SHRM_BUILD_TOKEN_BASE
#             CF_API_KEY
#             SHAURMA_GOOGLE_CLIENT_ID  SHAURMA_GOOGLE_CLIENT_SECRET
#   variables: SHAURMA_MANIFEST_PUBKEYS (required public Ed25519 keys)
#   variables: SIGNPATH_ORGANIZATION_ID
# SignPath requires GitHub-hosted runners for every job before a signing request.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      edition:
        description: Edition (shaurma requires a private repository)
        type: choice
        options: [base, shaurma]
        default: base
      sign:
        description: Submit to SignPath (false = unsigned dry run)
        type: boolean
        default: false
      policy:
        description: SignPath signing policy
        type: choice
        options: [release-signing, test-signing]
        default: release-signing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIGNPATH_PROJECT: shaurma-launcher
  EDITION: ${{ inputs.edition || vars.RELEASE_EDITION || 'base' }}
  SIGN: ${{ github.event_name == 'push' || inputs.sign }}
  POLICY: ${{ inputs.policy || 'release-signing' }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release visibility
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          case "$EDITION" in base|shaurma) ;; *) echo 'Invalid edition'; exit 1 ;; esac
          if [ "$EDITION" = shaurma ] && [ "$VISIBILITY" != private ]; then
            echo 'Full-edition artifacts must be built in an approved private repository'
            exit 1
          fi

  windows-components:
    needs: [validate, checks]
    environment: release-base
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            shell/go.sum
            updater-backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Ensure a C compiler for cgo (backend.dll / updater.dll)
        shell: pwsh
        run: |
          $have = (Get-Command gcc -ErrorAction SilentlyContinue) -or
                  (Test-Path 'C:\mingw64\bin\gcc.exe') -or
                  (Test-Path 'C:\msys64\ucrt64\bin\gcc.exe') -or
                  (Test-Path 'C:\msys64\mingw64\bin\gcc.exe')
          if (-not $have) { choco install mingw -y --no-progress }

      - name: Build components (unsigned)
        shell: pwsh
        env:
          SHRM_BUILD_TOKEN_SHAURMA: ${{ env.EDITION == 'shaurma' && secrets.SHRM_BUILD_TOKEN_SHAURMA || '' }}
          SHRM_BUILD_TOKEN_BASE: ${{ env.EDITION == 'base' && secrets.SHRM_BUILD_TOKEN_BASE || '' }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SHAURMA_GOOGLE_CLIENT_ID: ${{ vars.SHAURMA_GOOGLE_CLIENT_ID || secrets.SHAURMA_GOOGLE_CLIENT_ID }}
          SHAURMA_GOOGLE_CLIENT_SECRET: ${{ secrets.SHAURMA_GOOGLE_CLIENT_SECRET }}
          SHAURMA_GOOGLE_CLIENT_KIND: ${{ vars.SHAURMA_GOOGLE_CLIENT_KIND }}
          SHAURMA_MANIFEST_PUBKEYS: ${{ vars.SHAURMA_MANIFEST_PUBKEYS }}
        run: ./scripts/build-windows.ps1 -Step components -Edition $env:EDITION -RequireSecrets

      - name: Check release components for forbidden credentials
        shell: pwsh
        run: ./scripts/check-release-secrets.ps1 -Directory dist/unsigned -Edition $env:EDITION

      - name: Upload unsigned components
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-components
          path: dist/unsigned
          if-no-files-found: error
          retention-days: 14

      - name: Upload web assets (frontend zips)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launcher-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 14

      - name: Sign components (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.POLICY }}
          artifact-configuration-slug: ${{ env.EDITION == 'base' && 'components' || 'components-team' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed

      - name: Select final components and verify signatures
        shell: pwsh
        run: |
          $src = if ($env:SIGN -eq 'true') { 'dist/signed' } else { 'dist/unsigned' }
          if ($env:SIGN -eq 'true') {
            ./scripts/verify-signatures.ps1 -Directory $src -Edition $env:EDITION -Stage components
            $bad = 0
            foreach ($f in Get-ChildItem $src -Recurse -Include *.exe, *.dll) {
              $s = Get-AuthenticodeSignature $f.FullName
              Write-Host ("{0}: {1} ({2})" -f $f.Name, $s.Status, $s.SignerCertificate.Subject)
              if ($s.Status -ne 'Valid') { $bad++ }
            }
            if ($bad -gt 0) { throw "$bad file(s) without a valid signature" }
          }
          Copy-Item $src dist/final -Recurse

      - name: Upload final components
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: components-final
          path: dist/final
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    environment: release-base
    needs: windows-components
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: components-final
          path: dist/final

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-assets
          path: dist/assets

      - name: Build installers
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Step installer -Edition $env:EDITION -ComponentsDir dist/final -AssetsDir dist/assets

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/setups | Out-Null
          Move-Item dist/*-setup.exe dist/setups

      - name: Upload unsigned installers
        id: upload-setups
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installers
          path: dist/setups
          if-no-files-found: error
          retention-days: 14

      - name: Sign installers (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.POLICY }}
          artifact-configuration-slug: ${{ env.EDITION == 'base' && 'installer' || 'installer-team' }}
          github-artifact-id: ${{ steps.upload-setups.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed-setups

      - name: Select final installers and verify signatures
        shell: pwsh
        run: |
          $src = if ($env:SIGN -eq 'true') { 'dist/signed-setups' } else { 'dist/setups' }
          if ($env:SIGN -eq 'true') {
            ./scripts/verify-signatures.ps1 -Directory $src -Edition $env:EDITION -Stage installer
            foreach ($f in Get-ChildItem $src -Filter *.exe) {
              $s = Get-AuthenticodeSignature $f.FullName
              Write-Host ("{0}: {1} ({2})" -f $f.Name, $s.Status, $s.SignerCertificate.Subject)
              if ($s.Status -ne 'Valid') { throw "$($f.Name): signature is $($s.Status)" }
            }
          }
          Copy-Item $src dist/installers -Recurse
          Get-ChildItem dist/installers -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content dist/installers/SHA256SUMS-windows.txt
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/installers/*.exe

      - name: Upload final installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-final
          path: dist/installers
          if-no-files-found: error
          retention-days: 14

      # Same layout as dist\app-<edition>: drop-in staging for the private release/CDN tooling.
      - name: Upload staging (signed components + zips)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-staging
          path: |
            dist/app-${{ env.EDITION }}
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: [validate, checks]
    environment: release-base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            shell/go.sum
            updater-backend/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: System packages (GTK4 / WebKitGTK 6.0)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build Linux components
        env:
          SHRM_BUILD_TOKEN_SHAURMA: ${{ env.EDITION == 'shaurma' && secrets.SHRM_BUILD_TOKEN_SHAURMA || '' }}
          SHRM_BUILD_TOKEN_BASE: ${{ env.EDITION == 'base' && secrets.SHRM_BUILD_TOKEN_BASE || '' }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SHAURMA_GOOGLE_CLIENT_ID: ${{ vars.SHAURMA_GOOGLE_CLIENT_ID || secrets.SHAURMA_GOOGLE_CLIENT_ID }}
          SHAURMA_GOOGLE_CLIENT_SECRET: ${{ secrets.SHAURMA_GOOGLE_CLIENT_SECRET }}
          SHAURMA_GOOGLE_CLIENT_KIND: ${{ vars.SHAURMA_GOOGLE_CLIENT_KIND }}
          SHAURMA_MANIFEST_PUBKEYS: ${{ vars.SHAURMA_MANIFEST_PUBKEYS }}
        run: bash scripts/build-linux.sh "$EDITION"

      # SignPath Foundation signs Windows files; Linux files get a verifiable GitHub
      # build-provenance attestation (check: gh attestation verify <file> -R <owner>/<repo>).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/linux-release/*.tar.gz
            dist/linux-release/SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-release
          path: dist/linux-release
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag' && (inputs.edition || vars.RELEASE_EDITION || 'base') == 'base' && (github.event_name == 'push' || inputs.sign)
    needs: [windows-installer, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installers-final
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: release
      - name: Create draft release (review, then publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/checksums
          cp release/SHA256SUMS-* release/checksums/
          gh release create "$GITHUB_REF_NAME" release/checksums/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME" --notes "Downloads: https://shaurma-launcher.org/ — Code signing policy: https://github.com/$GITHUB_REPOSITORY#code-signing-policy"
