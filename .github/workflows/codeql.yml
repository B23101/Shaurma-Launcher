name: codeql
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    if: github.event.repository.visibility == 'public'
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
      - name: Ensure cgo compiler
        if: matrix.language == 'go'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - name: Build Go source for analysis
        if: matrix.language == 'go'
        shell: pwsh
        run: |
          foreach ($module in @('backend', 'shell', 'bootstrap', 'updater-backend')) {
            Push-Location $module
            try {
              go build -tags production -o "$env:RUNNER_TEMP/$module-codeql.exe" .
              if ($LASTEXITCODE -ne 0) { throw "Analysis build failed: $module" }
              if ($module -eq 'backend') {
                go build -tags production,shaurma -o "$env:RUNNER_TEMP/backend-full-codeql.exe" .
                if ($LASTEXITCODE -ne 0) { throw 'Full-edition analysis build failed' }
              }
            } finally { Pop-Location }
          }
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
