name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Scan complete history with redacted findings
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.3 git --redact=100 --no-banner --log-opts=--all --gitleaks-ignore-path .github/gitleaks.ignore .
  go:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: backend
            tags: ''
          - module: backend
            tags: shaurma
          - module: shell
            tags: ''
          - module: bootstrap
            tags: ''
          - module: updater-backend
            tags: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Ensure cgo compiler
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress }
      - name: Tests
        working-directory: ${{ matrix.module }}
        run: go test -tags "${{ matrix.tags }}" ./... -timeout 10m
      - name: Production signature policy
        if: matrix.module == 'bootstrap' || matrix.module == 'shell'
        working-directory: ${{ matrix.module }}
        run: go test -tags production manifestsig.go manifestsig_test.go manifest_policy_production.go manifest_policy_production_test.go
      - name: Production updater signature policy
        if: matrix.module == 'updater-backend'
        working-directory: updater-backend
        run: go test -tags production ./internal/sigverify
      - name: Build policy
        if: matrix.module == 'bootstrap'
        shell: pwsh
        run: ./scripts/test-build-policy.ps1
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  required:
    name: ci-required
    if: ${{ always() }}
    needs: [secrets, go, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$SECRETS_RESULT" = success
          test "$GO_RESULT" = success
          test "$FRONTEND_RESULT" = success
