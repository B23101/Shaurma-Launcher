# Повна збірка Windows-лаунчера на GitHub (frontend, shell, bootstrap, backend.dll,
# updater.dll, setup.exe) скриптом scripts/build-windows.ps1. Pack Manager не потрібен —
# лише публічні теки репозиторію. Секрети — лише з GitHub Secrets.
#
# Запуск:
# GitHub сам збірку НЕ починає (тег-тригера немає). Запуск лише командою:
#   - Pack Manager: після локальної збірки й пушу коду викликає workflow_dispatch з версією;
#   - вручну: Actions -> build-windows -> Run workflow.
name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версія релізу, напр. 1.2.3"
        required: true
        type: string
      editions:
        description: "Редакції через кому: shaurma,base"
        required: false
        default: "shaurma,base"
        type: string
      release_notes:
        description: "Нотатки релізу (один пункт на рядок), необов'язково"
        required: false
        default: ""
        type: string
      create_release:
        description: "Створити чернетку релізу v<версія> з інсталяторами"
        required: false
        default: true
        type: boolean

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Визначити версію і редакції
        id: meta
        shell: pwsh
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_EDITIONS: ${{ inputs.editions }}
        run: |
          $version  = ($env:IN_VERSION).Trim() -replace '^v', ''
          $editions = if ([string]::IsNullOrWhiteSpace($env:IN_EDITIONS)) { 'shaurma,base' } else { ($env:IN_EDITIONS -replace '\s', '') }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') {
            throw "Некоректна версія '$version' (очікується X.Y.Z)"
          }
          foreach ($e in $editions.Split(',')) {
            if ($e -notin @('shaurma', 'base')) { throw "Невідома редакція '$e' (дозволено: shaurma, base)" }
          }
          "version=$version"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "editions=$editions" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Версія: $version, редакції: $editions"

      - name: Перевірити обов'язкові секрети
        shell: pwsh
        env:
          TOKEN_SHAURMA: ${{ secrets.TOKEN_SHAURMA }}
          TOKEN_BASE: ${{ secrets.TOKEN_BASE }}
        run: |
          # Збірка вимагає ОБИДВА токени (updater.dll вшиває обидва), навіть для однієї редакції.
          $missing = @('TOKEN_SHAURMA', 'TOKEN_BASE') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            throw "Не задано GitHub Secrets: $($missing -join ', '). Settings -> Secrets and variables -> Actions."
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            shell/go.sum
            updater-backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Встановити wails3 CLI (для іконки/маніфесту/version-info exe)
        shell: pwsh
        run: |
          # Версія має збігатися з $wailsCliVersion у scripts/build-windows.ps1
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.121
          if ($LASTEXITCODE -ne 0) { throw 'go install wails3 впав' }
          $bin = Join-Path (go env GOPATH) 'bin\wails3.exe'
          if (-not (Test-Path $bin)) { throw "wails3.exe не знайдено: $bin" }
          # Збірка шукає $HOME\go\bin\wails3.exe, а потім PATH — додаємо й у PATH.
          (Split-Path $bin) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Встановити C-компілятор (cgo для backend.dll / updater.dll)
        shell: pwsh
        run: |
          $bash = 'C:\msys64\usr\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            choco install msys2 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install msys2 впав' }
          }
          $ok = $false
          foreach ($i in 1..3) {
            & $bash -lc 'pacman --noconfirm --needed -Sy mingw-w64-ucrt-x86_64-gcc'
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "pacman спроба $i впала, повтор…"
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw 'Не вдалося встановити mingw-w64-ucrt-x86_64-gcc' }
          & 'C:\msys64\ucrt64\bin\gcc.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'gcc не працює' }

      - name: Перевірити Inno Setup
        shell: pwsh
        run: |
          $paths = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe')
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup впав' }
          }
          if (-not ($paths | Where-Object { Test-Path $_ })) { throw 'ISCC.exe не знайдено' }

      - name: Збірка лаунчера
        shell: pwsh
        env:
          TOKEN_SHAURMA: ${{ secrets.TOKEN_SHAURMA }}
          TOKEN_BASE: ${{ secrets.TOKEN_BASE }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MANIFEST_PUB_KEYS: ${{ secrets.MANIFEST_PUB_KEYS }}
          SIGN_CMD: ${{ secrets.SIGN_CMD }}
          SHAURMA_SIGNER_THUMBPRINTS: ${{ vars.SHAURMA_SIGNER_THUMBPRINTS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ steps.meta.outputs.version }}
          EDITIONS: ${{ steps.meta.outputs.editions }}
        run: |
          ./scripts/build-windows.ps1 -Version $env:VERSION -Editions $env:EDITIONS -ReleaseNotes $env:RELEASE_NOTES

      - name: Перевірити результат
        id: verify
        shell: pwsh
        env:
          EDITIONS: ${{ steps.meta.outputs.editions }}
        run: |
          # Додаткова перевірка наявності всіх файлів після збірки.
          $setup = @{ shaurma = 'ShaurmLauncher-setup.exe'; base = 'ShaurmLauncherBase-setup.exe' }
          $exe   = @{ shaurma = 'ShaurmLauncher.exe';       base = 'ShaurmLauncherBase.exe' }
          $errors = @()
          foreach ($e in $env:EDITIONS.Split(',')) {
            $app = "dist\app-$e"
            $need = @("dist\$($setup[$e])", "$app\$($exe[$e])", "$app\bootstrap\$($exe[$e])",
                      "$app\backend.dll", "$app\updater.dll", "$app\frontend.zip",
                      "$app\updater-frontend.zip", "$app\launcher-version.json")
            foreach ($f in $need) {
              if (-not (Test-Path $f) -or (Get-Item $f).Length -eq 0) { $errors += "відсутній або порожній: $f" }
            }
          }
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          $sums = Get-ChildItem dist -Filter '*-setup.exe' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          $sums

      - name: Артефакт — інсталятори
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ steps.meta.outputs.version }}
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Артефакт — компоненти оновлення (для CDN)
        uses: actions/upload-artifact@v4
        with:
          name: components-${{ steps.meta.outputs.version }}
          path: |
            dist/app-*/
            !dist/app-*/frontend/**
            !dist/app-*/updater-frontend/**
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.create_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: setup-${{ needs.build.outputs.version }}
          path: release
      - name: Чернетка релізу
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
