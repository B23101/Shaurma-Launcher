# The ONLY launcher build workflow (single launcher, no editions).
#
# Started only by Pack Manager (workflow_dispatch) with a signed build order:
#   version  X.Y.Z (must equal installer/VERSION in the commit)
#   sha      full commit SHA to build (must be on main)
#   order    build order signed by the release key (checked against vars.ORDER_PUBKEYS)
# No tag triggers. GitHub is an UNTRUSTED builder: it never holds signing keys.
# Users trust the update manifest that Pack Manager signs after it verifies the
# attestation of this run. The order check only guards against accidental runs.
#
# Secrets: SIGNPATH_API_TOKEN (environment "release"), CF_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
# Variables (public): ORDER_PUBKEYS, SIGNPATH_ORGANIZATION_ID, SHAURMA_MANIFEST_PUBKEYS,
#   SHAURMA_ROOT_PUBKEYS, SHAURMA_KEYSET_B64, SHAURMA_KEYSET_SIG, SHAURMA_GOOGLE_CLIENT_ID.
name: build-launcher

on:
  workflow_dispatch:
    inputs:
      version:
        description: Launcher version X.Y.Z
        required: true
        type: string
      sha:
        description: Full commit SHA to build (on main)
        required: true
        type: string
      order:
        description: Signed build order (Pack Manager)
        required: true
        type: string
      release_notes:
        description: Release notes
        required: false
        type: string
        default: ''
      sign:
        description: Submit to SignPath (false = unsigned, manifest uses authenticode waived)
        type: boolean
        default: false
      policy:
        description: SignPath signing policy
        type: choice
        options: [release-signing, test-signing]
        default: release-signing

concurrency:
  group: build-launcher
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIGNPATH_PROJECT: shaurma-launcher
  BUILD_VERSION: ${{ inputs.version }}
  BUILD_SHA: ${{ inputs.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version, sha and branch
        run: |
          [[ "$BUILD_VERSION" =~ ^[0-9]{1,6}(\.[0-9]{1,6}){2,3}$ ]] || { echo 'bad version'; exit 1; }
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'sha must be a full 40-hex commit'; exit 1; }
          [ "$(git rev-parse HEAD)" = "$BUILD_SHA" ] || { echo 'checked out commit differs from sha'; exit 1; }
          git merge-base --is-ancestor "$BUILD_SHA" origin/main || { echo 'sha is not on main'; exit 1; }
          file="$(tr -d ' \r\n' < installer/VERSION)"
          [ "$file" = "$BUILD_VERSION" ] || { echo "installer/VERSION ($file) != version input"; exit 1; }

      - name: Verify signed build order
        env:
          ORDER: ${{ inputs.order }}
          ORDER_PUBKEYS: ${{ vars.ORDER_PUBKEYS }}
        run: |
          node --input-type=module -e '
            const { ORDER, ORDER_PUBKEYS, BUILD_VERSION, BUILD_SHA } = process.env;
            const keys = (ORDER_PUBKEYS || "").split(",").map(s => s.trim()).filter(Boolean);
            if (!keys.length) throw new Error("ORDER_PUBKEYS is not set");
            const [p, s] = String(ORDER || "").split(".");
            const payload = Buffer.from(p || "", "base64url");
            const sig = Buffer.from(s || "", "base64url");
            const msg = Buffer.concat([Buffer.from("shaurma-build-order-v1\n"), payload]);
            let ok = false;
            for (const k of keys) {
              const key = await crypto.subtle.importKey("raw", Buffer.from(k, "base64"), { name: "Ed25519" }, false, ["verify"]);
              if (await crypto.subtle.verify({ name: "Ed25519" }, key, sig, msg)) { ok = true; break; }
            }
            if (!ok) throw new Error("build order signature is invalid");
            const o = JSON.parse(payload.toString("utf8"));
            if (o.v !== 1 || o.version !== BUILD_VERSION || o.sha !== BUILD_SHA) throw new Error("order does not match inputs");
            if (Math.floor(Date.now() / 1000) > o.expires) throw new Error("order expired");
            console.log("build order OK:", o.version, o.sha);
          '

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  windows-components:
    needs: [validate, checks]
    environment: release
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # No dependency caches in release jobs (SignPath origin verification).
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.11.0

      - name: Ensure a C compiler for cgo (pinned)
        shell: pwsh
        run: |
          $have = (Test-Path 'C:\msys64\ucrt64\bin\gcc.exe') -or (Test-Path 'C:\mingw64\bin\gcc.exe')
          if (-not $have) { choco install mingw --version=13.2.0 -y --no-progress }

      # Single launcher: no channel tokens. Client API keys (CurseForge, Google sign-in)
      # stay embedded as before, like in other launchers.
      - name: Build components (unsigned)
        shell: pwsh
        env:
          SHAURMA_MANIFEST_PUBKEYS: ${{ vars.SHAURMA_MANIFEST_PUBKEYS }}
          SHAURMA_ROOT_PUBKEYS: ${{ vars.SHAURMA_ROOT_PUBKEYS }}
          SHAURMA_KEYSET_B64: ${{ vars.SHAURMA_KEYSET_B64 }}
          SHAURMA_KEYSET_SIG: ${{ vars.SHAURMA_KEYSET_SIG }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SHAURMA_GOOGLE_CLIENT_ID: ${{ vars.SHAURMA_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          SHAURMA_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:SHAURMA_ROOT_PUBKEYS) { throw 'SHAURMA_ROOT_PUBKEYS is required: the single launcher must carry the new update system' }
          ./scripts/build-windows.ps1 -Step components -Bundle -Edition shaurma -Version $env:BUILD_VERSION

      - name: Check release components for forbidden credentials
        shell: pwsh
        run: ./scripts/check-release-secrets.ps1 -Directory dist/unsigned -Edition shaurma

      - name: Upload unsigned components
        id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-components
          path: dist/unsigned
          if-no-files-found: error
          retention-days: 14

      - name: Upload web assets (frontend zips)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launcher-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 14

      - name: Sign components (SignPath)
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.policy }}
          artifact-configuration-slug: components
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed

      - name: Select final components and verify signatures
        shell: pwsh
        env:
          SIGN: ${{ inputs.sign }}
        run: |
          $src = if ($env:SIGN -eq 'true') { 'dist/signed' } else { 'dist/unsigned' }
          if ($env:SIGN -eq 'true') { ./scripts/verify-signatures.ps1 -Directory $src -Edition shaurma -Stage components }
          Copy-Item $src dist/final -Recurse

      - name: Upload final components
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: components-final
          path: dist/final
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    needs: windows-components
    environment: release
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Ensure Inno Setup (pinned)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.4.3 -y --no-progress }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: components-final
          path: dist/final

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-assets
          path: dist/assets

      - name: Build installer
        shell: pwsh
        # -Bundle: setup ставить усі компоненти одразу (без докачки з CDN за токеном).
        run: ./scripts/build-windows.ps1 -Step installer -Bundle -Edition shaurma -ComponentsDir dist/final -AssetsDir dist/assets -Version $env:BUILD_VERSION

      - name: Upload unsigned installer
        id: upload-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installer
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Sign installer (SignPath)
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ inputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed-setup

      # Two releases: components (the exact files the launcher downloads, flat
      # names) and the installer on its own (tag installer-v<version>).
      # Order: build -> Authenticode -> hash -> attest (users can verify the final files).
      - name: Collect release assets and checksums
        shell: pwsh
        env:
          SIGN: ${{ inputs.sign }}
        run: |
          $out = 'dist/release'
          $inst = 'dist/installer'
          New-Item -ItemType Directory -Force $out, $inst | Out-Null
          $setupDir = if ($env:SIGN -eq 'true') { 'dist/signed-setup' } else { 'dist' }
          if ($env:SIGN -eq 'true') { ./scripts/verify-signatures.ps1 -Directory $setupDir -Edition shaurma -Stage installer }
          $setup = @(Get-ChildItem "$setupDir/*-setup.exe")
          if ($setup.Count -ne 1) { throw "expected exactly one setup.exe, found $($setup.Count)" }
          Copy-Item $setup[0].FullName "$inst/ShaurmaLauncher-setup.exe"
          '{0}  {1}' -f (Get-FileHash "$inst/ShaurmaLauncher-setup.exe" -Algorithm SHA256).Hash.ToLower(), 'ShaurmaLauncher-setup.exe' |
            Set-Content "$inst/SHA256SUMS" -Encoding ascii
          Copy-Item dist/final/shaurma/ShaurmLauncher.exe "$out/ShaurmLauncher.exe"
          Copy-Item dist/final/shaurma/backend.dll "$out/backend.dll"
          Copy-Item dist/final/shaurma/updater.dll "$out/updater.dll"
          Copy-Item dist/assets/frontend.zip "$out/frontend.zip"
          Copy-Item dist/assets/updater-frontend.zip "$out/updater-frontend.zip"
          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "$out/SHA256SUMS" -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/release/*.exe
            dist/release/*.dll
            dist/release/*.zip
            dist/release/SHA256SUMS
            dist/installer/ShaurmaLauncher-setup.exe

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/release
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-assets
          path: dist/installer
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-assets
          path: installer
      # DRAFT only. Pack Manager verifies attestation + hashes, uploads the signed
      # launcher-manifest.json (+ .sig, keyset.json) and only then publishes.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          policy="[Code signing policy]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#code-signing-policy)"
          gh release create "v$BUILD_VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --draft --title "v$BUILD_VERSION" \
            --notes "${NOTES:-Release v$BUILD_VERSION}

          Built from $BUILD_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.
          Verify: gh attestation verify <file> -R $GITHUB_REPOSITORY

          $policy"
          # Installer: separate release, never Latest (Pack Manager publishes it).
          gh release create "installer-v$BUILD_VERSION" installer/* --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --draft --latest=false --title "Installer v$BUILD_VERSION" \
            --notes "Installer for Shaurma Launcher v$BUILD_VERSION. Built from $BUILD_SHA.

          $policy"
