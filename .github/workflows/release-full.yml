name: release-full

# Повний реліз лаунчера (редакція shaurma): збирає ВСІ компоненти
# (shell.exe, backend.dll, updater.dll, frontend.zip, updater-frontend.zip)
# і setup.exe, після чого публікує їх у GitHub Releases.
#
# Запуск — коли Pack Manager каже, що версія ПОВНА (X.Y.Z):
#
#   POST /repos/{owner}/{repo}/dispatches
#   { "event_type": "full-release",
#     "client_payload": { "version": "2.4.1", "release_notes": "..." } }
#
# або вручну: Actions → release-full → Run workflow (version = 2.4.1).
# Версія з неповним/бета-форматом (2.4.1-beta, 2.4.1.0) відхиляється.
#
# Секрети (GitHub Actions):
#   secrets:  SHRM_BUILD_TOKEN_SHAURMA, CF_API_KEY,
#             SHAURMA_GOOGLE_CLIENT_ID / SHAURMA_GOOGLE_CLIENT_SECRET
#   variables: SHAURMA_MANIFEST_PUBKEYS, SHAURMA_GOOGLE_CLIENT_KIND
#
# Токен Shaurma вшивається в backend.dll, тому повна збірка не повинна
# публікуватися в публічному репозиторії. Публікацію в публічному репо
# можна дозволити явно: repository variable ALLOW_FULL_EDITION_RELEASE=true.
on:
  repository_dispatch:
    types: [full-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Повна версія у форматі X.Y.Z (напр. 2.4.1)"
        required: true
      release_notes:
        description: "Нотатки релізу (необов'язково)"
        required: false
        default: ""
      publish:
        description: "Публікувати реліз на GitHub"
        type: boolean
        default: true

concurrency:
  group: release-full-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  EDITION: shaurma
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  RELEASE_NOTES: ${{ github.event.client_payload.release_notes || inputs.release_notes }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a complete X.Y.Z version
        env:
          V: ${{ env.VERSION }}
        run: |
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Full release needs a complete X.Y.Z version (got '$V')"
            exit 1
          fi

      - name: Guard full-edition publish
        if: github.event_name == 'repository_dispatch' || inputs.publish
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          ALLOW: ${{ vars.ALLOW_FULL_EDITION_RELEASE }}
        run: |
          if [ "$VISIBILITY" != private ] && [ "$ALLOW" != true ]; then
            echo "::error::Full builds embed the Shaurma CDN token in backend.dll. Publish from a private repository, or set repository variable ALLOW_FULL_EDITION_RELEASE=true if you accept publishing the token."
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  components:
    needs: [validate, checks]
    # Той самий environment, де вже лежать SHRM_BUILD_TOKEN_SHAURMA та
    # решта секретів збірки (див. release.yml).
    environment: release-base
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            shell/go.sum
            updater-backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure a C compiler for cgo (backend.dll / updater.dll)
        shell: pwsh
        run: |
          $have = (Get-Command gcc -ErrorAction SilentlyContinue) -or
                  (Test-Path 'C:\mingw64\bin\gcc.exe') -or
                  (Test-Path 'C:\msys64\ucrt64\bin\gcc.exe') -or
                  (Test-Path 'C:\msys64\mingw64\bin\gcc.exe')
          if (-not $have) { choco install mingw -y --no-progress }

      - name: Build all components (full edition)
        shell: pwsh
        env:
          SHRM_BUILD_TOKEN_SHAURMA: ${{ secrets.SHRM_BUILD_TOKEN_SHAURMA }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SHAURMA_GOOGLE_CLIENT_ID: ${{ vars.SHAURMA_GOOGLE_CLIENT_ID || secrets.SHAURMA_GOOGLE_CLIENT_ID }}
          SHAURMA_GOOGLE_CLIENT_SECRET: ${{ secrets.SHAURMA_GOOGLE_CLIENT_SECRET }}
          SHAURMA_GOOGLE_CLIENT_KIND: ${{ vars.SHAURMA_GOOGLE_CLIENT_KIND }}
          SHAURMA_MANIFEST_PUBKEYS: ${{ vars.SHAURMA_MANIFEST_PUBKEYS }}
        run: ./scripts/build-windows.ps1 -Step components -Edition shaurma -RequireSecrets

      - name: Check release components for forbidden credentials
        shell: pwsh
        run: ./scripts/check-release-secrets.ps1 -Directory dist/unsigned -Edition shaurma

      - name: Upload components
        uses: actions/upload-artifact@v4
        with:
          name: full-components
          path: dist/unsigned
          if-no-files-found: error
          retention-days: 14

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: full-assets
          path: dist/assets
          if-no-files-found: error
          retention-days: 14

  installer:
    needs: components
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - uses: actions/download-artifact@v4
        with:
          name: full-components
          path: dist/unsigned

      - uses: actions/download-artifact@v4
        with:
          name: full-assets
          path: dist/assets

      - name: Build full installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Step installer -Edition shaurma -ComponentsDir dist/unsigned -AssetsDir dist/assets

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Move-Item dist/*-setup.exe dist/release
          Get-ChildItem dist/release -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Add-Content dist/release/SHA256SUMS-windows.txt
          }
          Get-ChildItem dist/release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: full-installers
          path: dist/release
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'repository_dispatch' || inputs.publish
    needs: [components, installer]
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-installers
          path: release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) { throw 'No release assets' }
          $title = "Shaurma Launcher $env:VERSION"
          if ($env:RELEASE_NOTES) {
            gh release create "v$env:VERSION" @assets --repo "$env:GITHUB_REPOSITORY" --title $title --notes "$env:RELEASE_NOTES"
          } else {
            gh release create "v$env:VERSION" @assets --repo "$env:GITHUB_REPOSITORY" --title $title --generate-notes
          }
